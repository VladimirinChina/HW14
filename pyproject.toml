[project]
name = "hw14"
version = "0.1.0"
description = ""
authors = [
    {name = "vladimir",email = "vladimirinchina@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=1.20.2,<2.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "black (>=26.3.1,<27.0.0)"
]


[tool.black]
line_length = 119
exclude = '''
/(
    \.git
  | \.venv
)/
'''


[tool.isort]
line_length = 119

[tool.mypy]
mypy_path = "src"
disallow_untyped_defs = true
warn_return_any = true
exclude = '.venv'

[tool.flake8]
max-line-length = 119
exclude = [".venv", ".git", "__pycache__"]

[tool.poetry]
package-mode = false